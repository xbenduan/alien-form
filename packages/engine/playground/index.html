<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Page Engine — Playground</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
      .page { max-width: 960px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
      .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .filter-bar input { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
      .filter-bar button, .toolbar button { padding: 6px 14px; border: 1px solid #1677ff; background: #1677ff; color: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
      th { background: #fafafa; font-weight: 600; font-size: 13px; }
      td { font-size: 14px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
      .badge-active { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
      .badge-inactive { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
      .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; font-size: 14px; }
      .pagination button { padding: 4px 10px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
      .pagination button:disabled { opacity: .4; cursor: not-allowed; }
      .loading { text-align: center; padding: 24px; color: #999; }
      .error { color: #ff4d4f; padding: 12px; }
      h1 { font-size: 20px; }
      h2 { font-size: 16px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
